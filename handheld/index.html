<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f3ec"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"><title>3DS桌面图标 · Eli</title><style>:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#29372f;background:#f6f3ec}*{box-sizing:border-box}body{margin:0;font-size:16px}main{max-width:760px;padding:env(safe-area-inset-top) 16px max(24px,env(safe-area-inset-bottom));margin:auto}nav.top{display:flex;justify-content:space-between;align-items:center;min-height:56px;font-size:14px;color:#626d62}a{color:#356451}nav.top a{min-height:44px;display:inline-flex;align-items:center;text-decoration:none}h1{font-size:25px;margin:16px 0 10px;line-height:1.4}p{line-height:1.8;margin:8px 0}header p{font-size:14px;color:#626d62}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:18px 0}button{font:inherit;color:inherit;min-height:46px;border:1px solid #dadfd3;border-radius:9px;padding:8px 5px;font-size:14px;background:#fffdf8;cursor:pointer}.tabs button[aria-selected=true]{background:#29372f;color:white;border-color:#29372f}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #9c462c;outline-offset:2px}.panel{background:#fffdf8;border:1px solid #dadfd3;border-radius:14px;padding:20px}h2{font-size:21px;margin:0 0 8px;line-height:1.5}.lead{font-size:14px;color:#626d62;margin-bottom:18px}.steps{margin:0;padding-left:24px}.steps li{padding:4px 0 12px 4px;font-size:15px;line-height:1.75;overflow-wrap:anywhere}.steps li::marker{color:#9c462c;font-weight:700}.steps strong{display:block;font-size:16px;margin-bottom:3px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 14px;border-radius:9px;background:#356451;color:white;text-decoration:none;font-size:14px}.actions a.secondary{background:#eee7da;color:#29372f}details{border-top:1px solid #dadfd3;padding:4px 0;margin-top:14px}summary{font-size:14px;min-height:46px;line-height:1.6;align-content:center;cursor:pointer}details p,details li{font-size:14px;line-height:1.9}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.93em;overflow-wrap:anywhere;background:#eee7da;border-radius:4px;padding:1px 3px}.foot{font-size:12px;color:#626d62;line-height:1.8;margin:16px 0}#references a{display:inline-block;min-height:44px;align-content:center;overflow-wrap:anywhere}@media(max-width:420px){h1{font-size:24px;margin-top:8px}.panel{padding:16px 13px}.lead{margin-bottom:14px}.steps li{font-size:15px;padding-bottom:10px}.tabs{margin:15px 0}.actions a{flex:1;white-space:nowrap}h2{font-size:20px}}[hidden]{display:none!important}</style></head><body><main><nav class="top"><span class="home-links" style="display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 16px"><a href="https://eli-library.mysxl.cn/">← Eli的杂货间</a><a href="../">← 宝可梦图鉴</a></span><span>3DS / 2DS</span></nav><header><h1>让游戏出现在3DS桌面</h1><p>GBA用VC注入；NDS用Forwarder快捷入口。</p></header><div class="tabs" role="tablist" aria-label="玩法"><button role="tab" id="tab-vc" data-tab="vc" aria-controls="content" aria-selected="true">GBA图标</button><button role="tab" id="tab-nds" data-tab="nds" aria-controls="content" aria-selected="false">NDS图标</button><button role="tab" id="tab-gba" data-tab="gba" aria-controls="content" aria-selected="false">原生GBA</button><button role="tab" id="tab-saves" data-tab="saves" aria-controls="content" aria-selected="false">存档</button></div><section class="panel" id="content" role="tabpanel" aria-labelledby="tab-vc"></section><p class="foot">适用于已有现代自制环境的主机；仅使用可合法使用的备份或自制游戏。不提供商业ROM或成品CIA。按公开文档整理，未在你的掌机上实测。</p><details id="references"><summary>参考资料与工具来源</summary><p><a href="https://wiki.hacks.guide/wiki/3DS:Virtual_Console/Creation" target="_blank" rel="noopener noreferrer">VC创建指南：菜单名称、Beta 28作者下载链接</a><br><a href="https://wiki.hacks.guide/wiki/3DS:DS_games" target="_blank" rel="noopener noreferrer">NDS菜单与Forwarder安装</a><br><a href="https://github.com/MechanicalDragon0687/ndsForwarder" target="_blank" rel="noopener noreferrer">ndsForwarder作者项目</a><br><a href="https://github.com/profi200/open_agb_firm" target="_blank" rel="noopener noreferrer">open_agb_firm作者项目</a><br><a href="https://wiki.hacks.guide/wiki/3DS:Virtual_Console" target="_blank" rel="noopener noreferrer">VC原生运行与功能限制</a><br><a href="https://github.com/d0k3/GodMode9" target="_blank" rel="noopener noreferrer">GodMode9作者项目与说明</a></p></details></main><script>
(()=>{'use strict';const data={
vc:{title:'GBA独立图标：VC注入',lead:'需要Windows电脑、NSUI，以及已装FBI的主机。',steps:[['新建GBA项目','打开NSUI：File（文件）→ New（新建）→ Game Boy Advance。'],['载入自己的游戏','Project（项目）→ Load ROM（载入ROM），选自己的.gba文件。'],['设置标题与图标','填游戏名；在CIA metadata里点Load image from file，选本地PNG/JPG。核对存档类型。'],['导出并安装','Project → Export CIA，存到SD卡的cias文件夹。FBI → SD → cias → 选CIA → Install and delete CIA（安装并删安装包）。回HOME看图标。']],actions:[['获取NSUI Beta 28','https://www.dropbox.com/scl/fi/hxvfg8cwrebi5gxeikokr/Debug.zip?e=3&rlkey=crc9u3oenpvqf5pwnuff166f4&dl=0'],['核对原教程','https://wiki.hacks.guide/wiki/3DS:Virtual_Console/Creation']],extra:'<p>NSUI目前正式支持Windows。Mac原生运行不保证；这里没有在Mac上验证兼容环境。</p><p>若界面为西语：Herramientas（工具）→ opciones（选项）→ Idioma（语言）选English → Guardar（保存），同意重启。英文菜单可对照上方中文步骤。</p><p>GBA一般选原生VC注入方式。自行使用本地封面，不依赖联网图片库；不为下载图片随意安装系统补丁。</p><p>宝可梦原版常用<code>FLASH 1Mbit（128KiB）</code>存档；红／蓝／绿宝石还要核对RTC时钟，火红／叶绿通常不依赖RTC。汉化或改版以其说明为准，先测试保存和重读。</p><p>安装前核对标题ID，不覆盖已有游戏；旧VC先备份。原生GBA VC没有快进和即时存档，不能像普通3DS游戏自由切HOME。</p>'},
nds:{title:'NDS也能加桌面图标',lead:'保留现有.nds和存档；生成的是快捷入口。',steps:[['保持游戏路径不变','例如把自己的.nds留在/roms/nds/。先备份现有saves文件夹，不用重新下载游戏。'],['安装生成器','打开Universal-Updater，搜索并安装ndsForwarder；会带上所需的SD卡文件。'],['生成独立入口','从Homebrew Launcher打开NDS Forwarder Generator，找到对应.nds，按A，选择Yes（确认安装）。'],['回桌面启动','HOME菜单会出现游戏入口。原.nds不能删除或移动；换目录后要重建入口。']],actions:[['查看作者项目','https://github.com/MechanicalDragon0687/ndsForwarder'],['核对原教程','https://wiki.hacks.guide/wiki/3DS:DS_games']],extra:'<p>现有TWiLight Menu++可以保留。Forwarder从同一SD卡位置加载游戏，并非把NDS转换为原生3DS游戏。</p><p>先备份再核对存档：通常为游戏目录旁的<code>saves/</code>，文件主名与.nds一致。若TWiLight设置过其他存档路径，不能直接假定两个入口自动共用。</p><p>系统对这类DSiWare快捷入口有数量和空间限制；游戏很多时仍可使用TWiLight菜单，不必每个都放桌面。部分游戏仍需单独检查nds-bootstrap兼容性。</p>'},
gba:{title:'原生GBA：不逐个安装CIA',lead:'open_agb_firm适合多游戏菜单；不是独立桌面图标。',steps:[['下载并解压','获取作者发布的open_agb_firm压缩包。关机后把SD卡接电脑。'],['放好启动文件','open_agb_firm.firm放到/luma/payloads/；把压缩包内的3ds目录合并到SD卡根目录。'],['复制自己的游戏','把.gba放进/roms/gba/。已有存档先备份，不能把其他工具的档直接覆盖进去。'],['从开机菜单启动','按住START开机，选open_agb_firm，再选游戏。先在游戏里正常存档，按工具说明退出。']],actions:[['下载作者发布包','https://github.com/profi200/open_agb_firm/releases/download/beta_2024-12-24/open_agb_firm_beta_20241224.7z'],['查看作者说明','https://github.com/profi200/open_agb_firm']],extra:'<p>默认存档目录是<code>/3ds/open_agb_firm/saves/</code>。不同格式或大小的存档要先核对，复制前保留原文件。</p><p>没有快进与即时存档；不要依赖合盖休眠。想从HOME图标直接打开单个GBA游戏，切到“GBA图标”看VC方案。</p>'},
saves:{title:'别把不同玩法的存档混用',lead:'先另存备份，再迁移或重装；不要覆盖唯一原档。',steps:[['NDS菜单 / Forwarder','通常在游戏目录旁的saves文件夹，名字与.nds对应；检查自己是否改过存档位置。'],['open_agb_firm','默认/3ds/open_agb_firm/saves/。先备份整个目录，再考虑转换存档格式。'],['GBA VC','使用GodMode9的GBA VC专门流程处理；不能把普通3DS的Checkpoint步骤直接套用。'],['普通3DS游戏','可用Checkpoint。导出文件通常在/3ds/Checkpoint/saves/，再复制一份到电脑。']],actions:[['查存档类型','../save-types/index.html'],['GodMode9说明','https://github.com/d0k3/GodMode9'],['Checkpoint作者项目','https://github.com/BernardoGiordano/Checkpoint']],extra:'<p>VC、open_agb_firm和模拟器并不保证能直接互换.sav；尤其注意GBA Flash存档大小、工具附加数据及最后运行的VC标题。这里只提供位置速查，不执行恢复或写入。</p><p>不要让“新开档”覆盖旧记录。迁移前同时保存旧档、原游戏文件名与所用工具；验证能正常读取后再继续玩。</p>'}
};const panel=document.getElementById('content');function show(id){if(!data[id])id='vc';const d=data[id];document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===id;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;});panel.setAttribute('aria-labelledby','tab-'+id);panel.innerHTML='<h2>'+d.title+'</h2><p class="lead">'+d.lead+'</p><ol class="steps">'+d.steps.map(([t,s])=>'<li><strong>'+t+'</strong>'+s+'</li>').join('')+'</ol><div class="actions">'+d.actions.map(([t,u],i)=>'<a class="'+(i?'secondary':'')+'" href="'+u+'" target="_blank" rel="noopener noreferrer">'+t+' →</a>').join('')+'</div><details><summary>注意事项 / 适用范围</summary>'+d.extra+'</details>';try{history.replaceState(null,'','#'+id);}catch{}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));document.querySelector('.tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const bs=[...document.querySelectorAll('[data-tab]')],i=bs.findIndex(b=>b.getAttribute('aria-selected')==='true'),next=(i+(e.key==='ArrowRight'?1:3))%4;show(bs[next].dataset.tab);bs[next].focus();};show(location.hash.slice(1));window.addEventListener('hashchange',()=>show(location.hash.slice(1)));})();
</script></body></html>
